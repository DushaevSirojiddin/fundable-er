[project]
name = "fundable-er"
version = "0.1.0"
description = "Entity resolution and link enrichment for organizations and people (Fundable case study)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "unidecode>=1.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
